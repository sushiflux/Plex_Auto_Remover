name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine channel and tags
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER%-*}"
          IMAGE="ghcr.io/sushiflux/plex-auto-remover"

          if [[ "$TAG" == *-nightly ]]; then
            CHANNEL="nightly"
            PRE="true"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:nightly"
            CHANGELOG_FILE="CHANGELOG.nightly.md"
          elif [[ "$TAG" == *-beta ]]; then
            CHANNEL="beta"
            PRE="true"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:beta"
            CHANGELOG_FILE="CHANGELOG.beta.md"
          else
            CHANNEL="release"
            PRE="false"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest,${IMAGE}:beta,${IMAGE}:nightly"
            CHANGELOG_FILE="CHANGELOG.md"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Plex Auto Remover
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Extract release notes
        id: notes
        run: |
          FILE="${{ steps.meta.outputs.changelog_file }}"
          if [ -f "$FILE" ]; then
            cat "$FILE" > release_notes.md
          else
            echo "Release ${{ steps.meta.outputs.tag }}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release_notes.md
          generate_release_notes: false
